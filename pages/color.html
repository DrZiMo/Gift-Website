<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles.css">
    <title>Gift for you 🎉</title>
</head>

<body>
    <div class="wrapper">
        <div class="container">
            <div class="big-text">
                Second Question
            </div>
            <div class="small-text">
                What is your favourite color ?
            </div>
            <div class="color-grid">
                <div class="color" data-color="red">
                    <div class="red"></div>
                </div>
                <div class="color" data-color="white">
                    <div class="white"></div>
                </div>
                <div class="color" data-color="black">
                    <div class="black"></div>
                </div>
                <div class="color" data-color="pink">
                    <div class="pink"></div>
                </div>
                <div class="color" data-color="blue">
                    <div class="blue"></div>
                </div>
                <div class="color" data-color="voilet">
                    <div class="voilet"></div>
                </div>
                <div class="color" data-color="orange">
                    <div class="orange"></div>
                </div>
                <div class="color" data-color="green">
                    <div class="green"></div>
                </div>
                <div class="color" data-color="yellow">
                    <div class="yellow"></div>
                </div>
            </div>
            <div class="add-color">
                <input type="text" placeholder="Type your favourite color ..." class="input">
                <div class="button add-color-btn">None of these</div>
            </div>
        </div>
    </div>
    <script>
        const container = document.querySelector(".container");
        const bigText = document.querySelector(".big-text");
        const smallText = document.querySelector(".small-text");
        const grid = document.querySelector(".color-grid");
        const colors = document.querySelectorAll('.color');
        const addColor = document.querySelector('.add-color-btn');
        const input = document.querySelector(".input");

        window.onload = () => {
            input.style.display = "none";
        }

        addColor.onclick = () => {
            input.style.display = "block";
            addColor.innerHTML = "Add";
            addColor.classList.add("add");
            addColor.classList.remove("add-color-btn");


            const addBtn = document.querySelector('.add');
            addBtn.onclick = () => {
                let color = input.value;
                grid.style.display = "none";
                input.style.display = "none";
                addBtn.style.display = "none";
                bigText.textContent = `${color}?! 😂`;
                smallText.innerHTML = "Really ?! I thought it was blue<br> wanna continue ?";

                const btns = document.createElement("div");
                btns.className = "buttons";
                container.appendChild(btns);

                const link1 = document.createElement("a");
                link1.href = "activity.html";
                btns.appendChild(link1);

                const link2 = document.createElement("a");
                link2.href = "sorry.html";
                btns.appendChild(link2);

                const yesBtn = document.createElement("div");
                yesBtn.className = "button";
                yesBtn.textContent = "Yes";
                link1.appendChild(yesBtn);

                const noBtn = document.createElement("div");
                noBtn.className = "button";
                noBtn.textContent = "No"
                link2.appendChild(noBtn);
            }
        }

        colors.forEach(color => {
            color.onclick = () => {
                let selectedColor = color.dataset.color;
                console.log(selectedColor);

                checkColor(selectedColor);
            }
        })

        function checkColor(color) {
            if (color == "blue") {
                grid.style.display = "none";
                addColor.style.display = "none";
                input.style.display = "none";
                bigText.textContent = "I know it! 😂";
                smallText.innerHTML = "This one also was easy.<br>wanna continue ?";

                const btns = document.createElement("div");
                btns.className = "buttons";
                container.appendChild(btns);

                const link1 = document.createElement("a");
                link1.href = "activity.html";
                btns.appendChild(link1);

                const link2 = document.createElement("a");
                link2.href = "sorry.html";
                btns.appendChild(link2);

                const yesBtn = document.createElement("div");
                yesBtn.className = "button";
                yesBtn.textContent = "Yes";
                link1.appendChild(yesBtn);

                const noBtn = document.createElement("div");
                noBtn.className = "button";
                noBtn.textContent = "No"
                link2.appendChild(noBtn);
            }
            else {
                grid.style.display = "none";
                addColor.style.display = "none";
                bigText.textContent = "Really ?";
                smallText.innerHTML = "I thoung it was Blue!!.<br>never mind, wanna continue ?";

                const btns = document.createElement("div");
                btns.className = "buttons";
                container.appendChild(btns);

                const link1 = document.createElement("a");
                link1.href = "color.html";
                btns.appendChild(link1);

                const link2 = document.createElement("a");
                link2.href = "sorry.html";
                btns.appendChild(link2);

                const yesBtn = document.createElement("div");
                yesBtn.className = "button";
                yesBtn.textContent = "Yes";
                link1.appendChild(yesBtn);

                const noBtn = document.createElement("div");
                noBtn.className = "button";
                noBtn.textContent = "No"
                link2.appendChild(noBtn);
            }
        }
    </script>
</body>

</html>
